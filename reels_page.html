<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reels</title>
    <link rel="stylesheet" href="navbar.css">
</head>
<body>
    <style>
        #all_container{
    display:flex;
    justify-content:center;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

#video_tag{
    width:360px;
    height:640px;
    object-fit:cover;
     scroll-snap-align:start;
}
    </style>
    <div id="navbar"></div>
    <br>
    <div id="all_container">
    </div>

    <script src="navbar.js"></script>
<script>

async function reel_get(){

    const API = "https://6a66fb27189fe5869eb6cfc7.mockapi.io/api/user/reels";
    const response = await fetch(API);
    const data = await response.json();
    const array1 = [];

    for(const val of data){
        array1.push(...val.reels);
    }
    
    // const array = ["videos/vid1.mp4","videos/vid2.mp4","videos/vid3.mp4","videos/vid4.mp4","videos/vid5.mp4","videos/vid6.mp4","videos/vid7.mp4","videos/vid8.mp4","videos/vid9.mp4"]

function random_post(arr){

const display_queue = [];

let n = arr.length;
while(n>0){

    const post = arr[Math.floor(Math.random()*arr.length)]
    if(!display_queue.includes(post)){
        display_queue.push(post);
        n--;
    }
}

const all_container = document.getElementById("all_container");

display_queue.forEach(post=>{
    
    if(post.split("/")[0]==="img"){
        all_container.innerHTML+= `
        <img src="${post}" id="video_tag">
        `
    }
    else{
        all_container.innerHTML+= `
        <video src="${post}" id="video_tag" controls controlsList="nodownload"></videos>
        `
    }
})
}

random_post(array1);
}

reel_get();

</script>
</body>
</html>
