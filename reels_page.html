<html lang="en">

</head>
<body>
    <style>
        #reels_container{
    display:flex;

    flex-direction:column;
    align-items:center;
    gap:20px;
}

#video_tag{
    width:360px;
    height:640px;
    object-fit:cover;
     scroll-snap-align:start;
}

    <div id="navbar"></div>
    <br>
    <div id="reels_container">
    <video id="video_tag"src="videos/1080x1920.mp4" controls></video>
    <video id="video_tag" src="videos/1080x1920.mp4" controls> </video>

    <script src="navbar.js"></script>
    <script>
        
        async function k() {
    const response = await fetch("https://api.apify.com/v2/datasets/NNQF54GrZqpEk3h43/items?signature=MC4xNzg3NTYwODMwODA2LmNka1NKQTRvcVNuS1E2eHdSeE1F&format=json&clean=true");

    const user = await response.json();

    const video = document.getElementById("video_tag");

    video.src = user[0].url;
}

k();


    </script>
